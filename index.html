<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eaf6ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="kickdoongs桌宠" />
    <meta name="application-name" content="kickdoongs桌宠" />
    <title>kickdoongs桌宠</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-tuxuan loading">
    <div id="loader" class="loader">
      <div class="loader-avatars">
        <img id="loaderTuxuan" alt="" />
        <img id="loaderHuadong" alt="" />
      </div>
      <div class="loader-title">把两只小可爱抱过来…</div>
      <div class="loader-bar"><i id="loaderFill"></i></div>
      <div class="loader-note" id="loaderNote">姐姐稍等一下下</div>
    </div>

    <div id="app" class="app">
      <header class="topbar">
        <div class="identity">
          <h1 id="petName">兔玹</h1>
          <p id="petTag">兔妞兔妞 · 姐姐的桌面宠物</p>
        </div>
        <div id="switcher" class="switcher" data-active="tuxuan">
          <span class="glider" aria-hidden="true"></span>
          <button class="switch-btn active" data-char="tuxuan" aria-label="切换到兔玹">
            <img id="avatarTuxuan" alt="" />
            <span>兔玹</span>
          </button>
          <button class="switch-btn" data-char="huadong" aria-label="切换到花东">
            <img id="avatarHuadong" alt="" />
            <span>花东</span>
          </button>
        </div>
      </header>

      <main id="stage" class="stage">
        <div id="ambient" class="ambient" aria-hidden="true"></div>
        <div class="glow" aria-hidden="true"></div>
        <div class="floor" aria-hidden="true"></div>

        <div id="petWrap" class="pet-wrap">
          <div id="bubble" class="bubble" role="status" aria-live="polite" hidden>
            <span id="bubbleText"></span>
            <i class="tail" aria-hidden="true"></i>
          </div>
          <div id="petFlip" class="pet-flip">
            <img id="pet" alt="兔玹" draggable="false" />
          </div>
          <div id="effects" class="effects" aria-hidden="true"></div>
        </div>

        <div id="hint" class="hint">点一点我，或者拖动我～</div>
      </main>

      <footer class="dock">
        <button class="action" data-action="pet" aria-label="摸摸头">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20s-7-4.2-7-9.2A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.8c0 5-7 9.2-7 9.2Z" />
            </svg>
          </span>
          <span>摸摸</span>
        </button>
        <button class="action" data-action="feed" aria-label="喂食">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 13h16a8 8 0 0 1-16 0Z" />
              <path d="M8.5 9.5c-.6-1.2.6-1.8 0-3M12 9.5c-.6-1.2.6-1.8 0-3M15.5 9.5c-.6-1.2.6-1.8 0-3" />
            </svg>
          </span>
          <span id="feedLabel">喂奶茶</span>
        </button>
        <button class="action" data-action="walk" aria-label="散步">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.5 5c1.4 0 2.1 1.2 2.1 2.5 0 1.4-.8 2.2-2.1 2.2S7.4 8.9 7.4 7.5C7.4 6.2 8.1 5 9.5 5Z" />
              <path d="M6.5 12.5c1.2.3 1.9 1.2 2.1 2.3.2 1.2-.3 2.1-1.3 2.6-1 .4-2 0-2.4-1-.5-1.1.1-2.2 1.6-3.9Z" />
              <path d="M15.5 10c1.4 0 2.1 1.2 2.1 2.5 0 1.4-.8 2.2-2.1 2.2s-2.1-.8-2.1-2.2c0-1.3.7-2.5 2.1-2.5Z" />
              <path d="M17.5 17c1.2.3 1.9 1.2 2.1 2.3.2 1.2-.3 2.1-1.3 2.6-1 .4-2 0-2.4-1-.5-1.1.1-2.2 1.6-3.9Z" />
            </svg>
          </span>
          <span>散步</span>
        </button>
        <button class="action" data-action="sleep" aria-label="睡觉">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A7.5 7.5 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
            </svg>
          </span>
          <span id="sleepLabel">睡觉</span>
        </button>
        <button class="action special" data-action="special" aria-label="特殊动作">
          <span class="action-icon">
            <svg id="iconBoard" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="10" width="18" height="3.2" rx="1.6" />
              <path d="M3 13.2c-1.4 0-2-.8-2-1.6M21 13.2c1.4 0 2-.8 2-1.6" />
              <circle cx="7.5" cy="17" r="1.5" />
              <circle cx="16.5" cy="17" r="1.5" />
            </svg>
            <svg id="iconFlip" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M4 9a7 7 0 0 1 12-3.5L18.5 8" />
              <path d="M18.5 4.5V8H15" />
              <path d="M20 15a7 7 0 0 1-12 3.5L5.5 16" />
              <path d="M5.5 19.5V16H9" />
            </svg>
          </span>
          <span id="specialLabel">滑板</span>
        </button>
        <button class="action action-float" data-action="float" aria-label="悬浮到手机屏幕">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="15" rx="3" />
              <rect x="11.5" y="10.5" width="7" height="6" rx="1.5" />
              <path d="M7 8.5h4M7 11.5h2.5" />
            </svg>
          </span>
          <span>悬浮</span>
        </button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
